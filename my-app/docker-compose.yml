# Explicit project name keeps this stack's containers, network and volumes
# namespaced and isolated from other projects sharing the VPS.
name: arlene-lms

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time (read from ./.env).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: arlene-web-application:latest
    container_name: arlene-web
    restart: unless-stopped
    ports:
      # Host port is configurable (WEB_PORT in .env) to avoid clashing with
      # other projects on a shared VPS. Container always listens on 3000.
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-only secret — used by the service-role Supabase client at runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Also available to the running server (used by password-reset action).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
