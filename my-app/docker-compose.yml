# Explicit project name keeps this stack's containers, network and volumes
# namespaced and isolated from other projects sharing the VPS.
name: arlene-lms

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Inlined into the client bundle at build time (read from ./.env).
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: arlene-web-application:latest
    container_name: arlene-web
    restart: unless-stopped
    ports:
      # Bound to loopback only: the public entrypoint is Caddy (80/443), so the
      # app must not be reachable over plain HTTP from the internet. Still
      # available on the box itself (curl / SSH tunnel) for debugging.
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # Server-only secret — used by the service-role Supabase client at runtime.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Also available to the running server (used by password-reset action).
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Public entrypoint: terminates TLS and proxies to "web" over the internal
  # network. Caddy obtains and renews the Let's Encrypt certificate itself.
  caddy:
    image: caddy:2-alpine
    container_name: arlene-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the {$...} placeholders in ./Caddyfile.
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys MUST persist, or every restart
      # re-requests a cert and will eventually hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
